name: SV Gate (Fast)

# v5.7 §4.25 — mechanical SV gate enforces the file-guarantee invariant
# (governance §1g). Runs on every PR touching code paths covered by the gate.
# Full gate (REAL campaign E2E) requires live API key + tmux + ~5 min — run
# locally before merging.

on:
  push:
    branches: [main]
    paths:
      - 'src/node/**'
      - 'src/scripts/**'
      - 'src/commands/rlp-desk.md'
      - 'src/governance.md'
      - 'tests/**'
      - 'package.json'
  pull_request:
    paths:
      - 'src/node/**'
      - 'src/scripts/**'
      - 'src/commands/rlp-desk.md'
      - 'src/governance.md'
      - 'tests/**'
      - 'package.json'

jobs:
  sv-gate-fast:
    name: SV Gate Fast (~30s)
    runs-on: macos-latest  # macOS provides zsh + node; tmux installed below
    timeout-minutes: 15  # ~1 min in practice; a hung step must never hold the runner for GitHub's 6h default
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install tmux (macOS runner image no longer pre-installs tmux)
        run: brew install tmux

      - name: Verify zsh + tmux available
        run: |
          zsh --version
          tmux -V

      - name: Check Node MANIFEST drift (PKG-1/PKG-2)
        run: node scripts/build-node-manifest.js --check

      - name: Run SV Gate Fast
        run: zsh tests/sv-gate-fast.sh

      - name: Upload SV gate logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sv-gate-fast-logs
          path: |
            tests/**/*.log
          if-no-files-found: ignore

  # GAP-1 (audit): CI previously ran ONLY the existence-grep fast gate — the Node
  # and zsh behavioral suites never ran in CI, so a PR could be green while most
  # tests were broken. This job RUNS them. First rollout is NON-blocking
  # (continue-on-error) to inventory CI-only flakiness (e.g. F6.1 us006 real-tmux
  # boundary) before flipping to blocking.
  # ROLLOUT: after one clean CI cycle, remove continue-on-error from test:node
  # (blocking); keep test:zsh non-blocking until any flaky real-tmux tests are
  # quarantined behind an env guard.
  behavioral-suites:
    name: Behavioral suites (test:node + test:zsh)
    runs-on: macos-latest
    # ~11 min in practice (test:zsh ~10 min, 137 files, slowest file ~94 s). A hung test once held
    # this job for ~6 h until GitHub cancelled it (run 38577918782). Per-file caps in test:zsh
    # (TEST_FILE_TIMEOUT) fail a hung file early; this is the outer backstop.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tests read pinned historical commits via `git show` (ORACLE_COMMIT); a depth-1 clone cannot

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install tmux
        run: brew install tmux

      - name: Run Node suite (test:node)
        id: test_node
        continue-on-error: true   # FLIP to blocking after one clean CI cycle (GAP-1)
        run: npm run test:node

      - name: Run zsh suite (test:zsh)
        id: test_zsh
        continue-on-error: true   # keep non-blocking until flaky real-tmux tests are quarantined
        run: npm run test:zsh

      - name: Report suite outcomes
        if: always()
        run: |
          echo "test:node outcome = ${{ steps.test_node.outcome }}"
          echo "test:zsh  outcome = ${{ steps.test_zsh.outcome }}"
          echo "GAP-1 rollout is non-blocking; flip test:node to blocking after a clean cycle."

      - name: Upload suite logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavioral-suite-logs
          path: |
            tests/**/*.log
          if-no-files-found: ignore

  # A-6 (reaudit wave 1): both jobs above run on macos-latest only, so a
  # BSD-only shell construct (e.g. `sed -i ''`) never surfaced in CI — it
  # silently broke on GNU sed (Ubuntu) while exiting 0. This job runs the
  # Node suite plus the init data-safety regression test on ubuntu-latest so
  # that class of defect is caught here instead of in a real GNU sed install.
  ubuntu-compat:
    name: Ubuntu compat (test:node + init data-safety)
    runs-on: ubuntu-latest
    timeout-minutes: 30  # ~1-3 min in practice
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tests read pinned historical commits via `git show` (ORACLE_COMMIT); a depth-1 clone cannot

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install zsh + tmux
        run: sudo apt-get update && sudo apt-get install -y zsh tmux

      - name: Verify zsh + tmux + GNU sed available
        run: |
          zsh --version
          tmux -V
          sed --version | head -1

      - name: Run init data-safety regression test (A-6 sed portability + A-7 PRD data loss)
        run: bash tests/test_init_data_safety.sh

      - name: Run Node suite (test:node)
        continue-on-error: true   # FLIP to blocking after one clean CI cycle (GAP-1)
        run: npm run test:node

      # C-01 / H-R5-01 signal-path tests, run on Linux (backlog 2026-10-25 item 3). Verified in an
      # ubuntu:24.04 container (zsh 5.9, tmux 3.4, mawk): all seven pass, ~85 s in total. NOTE: the flockfile
      # deadlock itself is a macOS libc behaviour and does not reproduce on glibc (the stress trials report
      # 0 hangs even against the pre-fix code), so on Linux these are behavioural + static-analysis checks.
      # Non-blocking for the first cycle, same rollout rule as test:node above (GAP-1); FLIP to blocking
      # together with test:node after one clean CI cycle. The parity test runs here too: its K-06
      # discrimination no longer assumes BSD libc regexec (Linux fix applied; 48/48 in the container).
      - name: Run signal/trap tests
        continue-on-error: true   # FLIP to blocking after one clean CI cycle (GAP-1)
        run: |
          rc=0
          for f in tests/test_signal_deadlock.zsh tests/test_signal_deadlock_external_kill.zsh \
                   tests/test_signal_trap.sh tests/test_ci_signal_trap_hang.sh \
                   tests/test_init_quarantines_foreign_signal.sh tests/test_iter_signal_key_tolerance.sh \
                   tests/test_signal_path_report_parity.zsh; do
            echo "=== $f ==="
            case "$(head -1 "$f")" in *zsh*) timeout 300 zsh "$f";; *) timeout 300 bash "$f";; esac || rc=1
          done
          exit $rc

      - name: Upload logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-compat-logs
          path: |
            tests/**/*.log
          if-no-files-found: ignore
