name: SV Gate (Fast)

# v5.7 §4.25 — mechanical SV gate enforces the file-guarantee invariant
# (governance §1g). Runs on every PR touching code paths covered by the gate.
# Full gate (REAL campaign E2E) requires live API key + tmux + ~5 min — run
# locally before merging.

on:
  push:
    branches: [main]
    paths:
      - 'src/node/**'
      - 'src/scripts/**'
      - 'src/commands/rlp-desk.md'
      - 'src/governance.md'
      - 'tests/**'
      - 'package.json'
  pull_request:
    paths:
      - 'src/node/**'
      - 'src/scripts/**'
      - 'src/commands/rlp-desk.md'
      - 'src/governance.md'
      - 'tests/**'
      - 'package.json'

jobs:
  sv-gate-fast:
    name: SV Gate Fast (~30s)
    runs-on: macos-latest  # macOS provides zsh + node; tmux installed below
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install tmux (macOS runner image no longer pre-installs tmux)
        run: brew install tmux

      - name: Verify zsh + tmux available
        run: |
          zsh --version
          tmux -V

      - name: Check Node MANIFEST drift (PKG-1/PKG-2)
        run: node scripts/build-node-manifest.js --check

      - name: Run SV Gate Fast
        run: zsh tests/sv-gate-fast.sh

      - name: Upload SV gate logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sv-gate-fast-logs
          path: |
            tests/**/*.log
          if-no-files-found: ignore

  # GAP-1 (audit): CI previously ran ONLY the existence-grep fast gate — the Node
  # and zsh behavioral suites never ran in CI, so a PR could be green while most
  # tests were broken. This job RUNS them. First rollout is NON-blocking
  # (continue-on-error) to inventory CI-only flakiness (e.g. F6.1 us006 real-tmux
  # boundary) before flipping to blocking.
  # ROLLOUT: after one clean CI cycle, remove continue-on-error from test:node
  # (blocking); keep test:zsh non-blocking until any flaky real-tmux tests are
  # quarantined behind an env guard.
  behavioral-suites:
    name: Behavioral suites (test:node + test:zsh)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install tmux
        run: brew install tmux

      - name: Run Node suite (test:node)
        id: test_node
        continue-on-error: true   # FLIP to blocking after one clean CI cycle (GAP-1)
        run: npm run test:node

      - name: Run zsh suite (test:zsh)
        id: test_zsh
        continue-on-error: true   # keep non-blocking until flaky real-tmux tests are quarantined
        run: npm run test:zsh

      - name: Report suite outcomes
        if: always()
        run: |
          echo "test:node outcome = ${{ steps.test_node.outcome }}"
          echo "test:zsh  outcome = ${{ steps.test_zsh.outcome }}"
          echo "GAP-1 rollout is non-blocking; flip test:node to blocking after a clean cycle."

      - name: Upload suite logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavioral-suite-logs
          path: |
            tests/**/*.log
          if-no-files-found: ignore
